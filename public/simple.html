<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Bot Dashboard</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            overflow: hidden; /* Prevent scrollbars on the body */
        }

        #main-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        #top-half {
            flex: 1; /* Takes up 50% of the height */
            display: flex;
            flex-direction: row;
            min-height: 0; /* Important for flexbox children to shrink properly */
        }

        #bottom-half {
            flex: 1; /* Takes up 50% of the height */
            display: flex;
            flex-direction: column;
            border-top: 2px solid #333;
        }

        .iframe-container {
            flex: 1; /* Each takes up 50% of the width of the top-half */
            border-left: 1px solid #333;
            border-right: 1px solid #333;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        #chat-log {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #444;
            padding: 8px;
            margin-bottom: 10px;
            background-color: #242424;
            border-radius: 4px;
        }

        #chat-input-form {
            display: flex;
            height: 40px;
        }

        #chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #444;
            background-color: #333;
            color: #f0f0f0;
            border-radius: 4px 0 0 4px;
            outline: none;
        }

        #chat-input:focus {
            border-color: #555;
        }

        #send-button {
            padding: 0 20px;
            border: 1px solid #444;
            border-left: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            font-weight: bold;
        }

        #send-button:hover {
            background-color: #45a049;
        }

        .chat-message {
            margin-bottom: 5px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="top-half">
            <div class="iframe-container">
                <iframe src="/inventory/" title="Web Inventory"></iframe>
            </div>
            <div class="iframe-container">
                <iframe src="/viewer/" title="Prismarine Viewer"></iframe>
            </div>
        </div>
        <div id="bottom-half">
            <div id="chat-container">
                <div id="chat-log"></div>
                <form id="chat-input-form" action="javascript:void(0);">
                    <input type="text" id="chat-input" placeholder="Type a message to send in-game..." autocomplete="off">
                    <button id="send-button" type="submit">Send</button>
                </form>
            </div>
        </div>
    </div>

    <!-- The official client build is ESM-only, so we need a different version for simple HTML script tags -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Connect to the server's Socket.IO namespace
            const socket = io({ path: '/socket.io' });

            const chatLog = document.getElementById('chat-log');
            const chatInputForm = document.getElementById('chat-input-form');
            const chatInput = document.getElementById('chat-input');

            // Function to add a new message to the chat log
            function addChatMessage(message) {
                const messageElement = document.createElement('div');
                messageElement.classList.add('chat-message');
                messageElement.textContent = message;
                chatLog.appendChild(messageElement);
                // Auto-scroll to the bottom
                chatLog.scrollTop = chatLog.scrollHeight;
            }

            // --- Event Listeners ---

            // Handle form submission to send a message
            chatInputForm.addEventListener('submit', () => {
                const message = chatInput.value.trim();
                if (message) {
                    // Emit the message to the server
                    socket.emit('send-chat-message', { message });
                    // Add the message to our own log instantly
                    addChatMessage(`You: ${message}`);
                    // Clear the input field
                    chatInput.value = '';
                }
            });

            // Listen for incoming chat messages from the server/bot
            socket.on('chat-message', ({ message }) => {
                addChatMessage(message);
            });

            socket.on('connect', () => {
                addChatMessage('🔌 Connected to the bot server.');
            });

            socket.on('disconnect', () => {
                addChatMessage('🔌 Disconnected from the bot server.');
            });
        });
    </script>
</body>
</html>
